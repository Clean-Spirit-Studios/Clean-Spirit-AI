name: gpt2_chat
description: Clean Spirit AI - offline chat with Gemma 4 E2B (LiteRT GPU) and Qwen3 4B (GGUF CPU).
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # GGUF inference - Qwen3 4B via llama.cpp
  # Pinned to exact prerelease - do NOT use ^0.9.0-dev.9 (see original notes)
  # ---------------------------------------------------------------------------
  llama_cpp_dart: 0.9.0-dev.9

  # ---------------------------------------------------------------------------
  # LiteRT-LM GPU inference - Gemma 4 E2B
  # Local plugin copied from cross-platform-llm-client/local_plugins/
  # Not on pub.dev - must be present at local_plugins/flutter_litert_lm/
  # ---------------------------------------------------------------------------
  flutter_litert_lm:
    path: local_plugins/flutter_litert_lm

  # ---------------------------------------------------------------------------
  # Core utilities (unchanged from original)
  # ---------------------------------------------------------------------------
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  dio: ^5.8.0
  resumable_downloader: ^0.0.38
  connectivity_plus: ^6.1.0
  wakelock_plus: ^1.2.10
  flutter_markdown: ^0.7.4

  # ---------------------------------------------------------------------------
  # Image + document attachment
  # ---------------------------------------------------------------------------
  image_picker: ^1.1.0
  file_picker: ^11.0.2
  permission_handler: ^11.3.0

  # Document text extraction - pure Dart, no native deps
  archive: ^4.0.9          # unzips DOCX (pure Dart)
  xml: ^7.0.1              # parses word/document.xml inside DOCX

  # PDF text extraction - Syncfusion (replaces read_pdf_text, no char limit)
  # Free for revenue under USD 1M - no key required for text extraction
  syncfusion_flutter_pdf: ^27.1.48

  # ---------------------------------------------------------------------------
  # Feature 1 - Animated GPU loading screen
  # ---------------------------------------------------------------------------
  lottie: ^3.1.0

  # ---------------------------------------------------------------------------
  # Feature 2 - Ghost icon SVG
  # ---------------------------------------------------------------------------
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ---------------------------------------------------------------------------
# Dependency overrides - force archive and xml to the versions required by
# llama_cpp_dart -> image ^4.7.2. Without this, any transitive dep still
# pinning archive ^3.x or xml ^6.x would break resolution.
# ---------------------------------------------------------------------------
dependency_overrides:
  archive: ^4.0.9
  xml: ^7.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/

  # Models are downloaded at runtime - no assets bundled.
  # This keeps the APK small (~20MB) instead of gigabytes.

name: gpt2_chat
description: Clean Spirit AI - offline chat with Gemma 4 E2B (LiteRT GPU) and Qwen3 4B (GGUF CPU).
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # GGUF inference - Qwen3 4B via llama.cpp
  # Pinned to exact prerelease - do NOT use ^0.9.0-dev.9 (see original notes)
  # ---------------------------------------------------------------------------
  llama_cpp_dart: 0.9.0-dev.9

  # ---------------------------------------------------------------------------
  # LiteRT-LM GPU inference - Gemma 4 E2B
  # Local plugin copied from cross-platform-llm-client/local_plugins/
  # Not on pub.dev - must be present at local_plugins/flutter_litert_lm/
  # ---------------------------------------------------------------------------
  flutter_litert_lm:
    path: local_plugins/flutter_litert_lm

  # ---------------------------------------------------------------------------
  # Optional: llama_flutter_android local plugin (needed by llama_cpp_dart
  # on Android for the native JNI bridge). Copy from cross-platform project
  # local_plugins/llama_flutter_android/ if the build requires it.
  # ---------------------------------------------------------------------------
  # llama_flutter_android:
  #   path: local_plugins/llama_flutter_android

  # ---------------------------------------------------------------------------
  # Core utilities (unchanged from original)
  # ---------------------------------------------------------------------------
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  dio: ^5.8.0
  resumable_downloader: ^0.0.38
  connectivity_plus: ^6.1.0
  wakelock_plus: ^1.2.10
  flutter_markdown: ^0.7.4

  # ---------------------------------------------------------------------------
  # Image + document attachment
  # ---------------------------------------------------------------------------
  image_picker: ^1.1.0
  file_picker: ^11.0.2
  permission_handler: ^11.3.0

  # Document text extraction
  archive: ^3.6.0          # unzips DOCX (pure Dart)
  xml: ^6.5.0              # parses word/document.xml inside DOCX
  syncfusion_flutter_pdf: ^33.2.6  # PDF text layer extraction (community license)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ---------------------------------------------------------------------------
# Dependency overrides
# If llama_flutter_android local plugin is enabled above, add this:
# ---------------------------------------------------------------------------
# dependency_overrides:
#   llama_flutter_android:
#     path: local_plugins/llama_flutter_android

flutter:
  uses-material-design: true

  # Models are downloaded at runtime - no assets bundled.
  # This keeps the APK small (~20MB) instead of gigabytes.
